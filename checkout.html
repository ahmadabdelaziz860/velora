<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F3EE" />
<title>Velora — Checkout</title>
<meta name="description" content="Velora — secure checkout." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kufam:ital,wght@0,400..900;1,400..900&family=Alexandria:wght@100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="velora.css">
</head>
<body class="is-co">

<div class="prog" id="prog" aria-hidden="true"></div>

<!-- الشريط العلوي بيتولّد من velora.js — ممنوع كتابته هنا -->

<div class="announce" role="complementary" aria-label="Store announcements">
  <div class="marquee" id="marquee"></div>
</div>

<header class="header" id="header">
  <div class="wrap header__in">
    <a href="velora.html" class="logo" aria-label="Velora home">Velora<i class="dot"></i></a>

    <nav class="hnav" aria-label="Main">
      <a href="shop.html" data-i18n="nav_shop">Shop</a>
      <a href="shop.html?f=new" data-i18n="nav_new">New In</a>
      <a href="shop.html?f=sale" data-i18n="nav_sale">Sale</a>
      <a href="page.html?p=about" data-i18n="nav_about">About</a>
    </nav>

    <button class="hbtn lang" id="langBtn" type="button" aria-label="Change language">
      <span id="langLabel">EN</span>
      <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 4.5L6 8.5L10 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="hbtn hbtn-search" id="searchBtnTop" type="button" aria-label="Search">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M11.5 21.75C5.85 21.75 1.25 17.15 1.25 11.5C1.25 5.85 5.85 1.25 11.5 1.25C17.15 1.25 21.75 5.85 21.75 11.5C21.75 17.15 17.15 21.75 11.5 21.75ZM11.5 2.75C6.67 2.75 2.75 6.68 2.75 11.5C2.75 16.32 6.67 20.25 11.5 20.25C16.33 20.25 20.25 16.32 20.25 11.5C20.25 6.68 16.33 2.75 11.5 2.75Z"/>
        <path d="M21.9999 22.7499C21.8099 22.7499 21.6199 22.6799 21.4699 22.5299L19.4699 20.5299C19.1799 20.2399 19.1799 19.7599 19.4699 19.4699C19.7599 19.1799 20.2399 19.1799 20.5299 19.4699L22.5299 21.4699C22.8199 21.7599 22.8199 22.2399 22.5299 22.5299C22.3799 22.6799 22.1899 22.7499 21.9999 22.7499Z"/>
      </svg>
    </button>

    <button class="hbtn" id="wishBtnTop" type="button" aria-label="Wishlist">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.6496C11.69 21.6496 11.39 21.6096 11.14 21.5196C7.32 20.2096 1.25 15.5596 1.25 8.68961C1.25 5.18961 4.08 2.34961 7.56 2.34961C9.25 2.34961 10.83 3.00961 12 4.18961C13.17 3.00961 14.75 2.34961 16.44 2.34961C19.92 2.34961 22.75 5.19961 22.75 8.68961C22.75 15.5696 16.68 20.2096 12.86 21.5196C12.61 21.6096 12.31 21.6496 12 21.6496ZM7.56 3.84961C4.91 3.84961 2.75 6.01961 2.75 8.68961C2.75 15.5196 9.32 19.3196 11.63 20.1096C11.81 20.1696 12.2 20.1696 12.38 20.1096C14.68 19.3196 21.26 15.5296 21.26 8.68961C21.26 6.01961 19.1 3.84961 16.45 3.84961C14.93 3.84961 13.52 4.55961 12.61 5.78961C12.33 6.16961 11.69 6.16961 11.41 5.78961C10.48 4.54961 9.08 3.84961 7.56 3.84961Z"/></svg>
      <span class="badge" id="wishBadge">0</span>
    </button>

    <button class="hbtn" id="cartBtnTop" type="button" aria-label="Open cart">
      <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7.5 7.66952V6.69952C7.5 4.44952 9.31 2.23952 11.56 2.02952C14.24 1.76952 16.5 3.87952 16.5 6.50952V7.88952" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.99995 22H14.9999C19.0199 22 19.7399 20.39 19.9499 18.43L20.6999 12.43C20.9699 9.99 20.2699 8 15.9999 8H7.99995C3.72995 8 3.02995 9.99 3.29995 12.43L4.04995 18.43C4.25995 20.39 4.97995 22 8.99995 22Z" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.4955 12H15.5045" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.49451 12H8.50349" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="badge" id="cartBadge">0</span>
    </button>
  </div>
</header>

<main>
  <section class="wrap co" id="co">
    <div class="co-head">
      <button class="co-back" id="coBack" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="co-ttl" id="coTtl">Check out</h1>
      <span class="co-sp"></span>
    </div>

    <nav class="co-steps" id="coSteps"></nav>

    <div class="co-grid" id="coGrid">
      <form id="coMain" novalidate></form>
      <aside class="co-side" id="coSide"></aside>
    </div>
  </section>

  <div class="co-bar" id="coBar"></div>
</main>

<footer class="footer" id="footer">
  <div class="wrap">
    <div class="footer__logo">Velora</div>
    <nav class="flinks" aria-label="Footer">
      <a href="velora.html" data-i18n="f_home">Home</a>
      <a href="page.html?p=about" data-i18n="f_about">About Us</a>
      <a href="page.html?p=contact" data-i18n="f_contact">Contact Us</a>
      <a href="shop.html" data-i18n="f_shop">Shop</a>
    </nav>
    <nav class="flinks sub" aria-label="Policies">
      <a href="page.html?p=privacy" data-i18n="f_privacy">Privacy Policy</a>
      <a href="page.html?p=returns" data-i18n="f_return">Return and Exchange Policy</a>
      <a href="page.html?p=shipping" data-i18n="f_ship">Shipping Policy</a>
    </nav>
    <p class="copy">© <span id="yr"></span> Velora — <span data-i18n="rights">All rights reserved.</span></p>
  </div>
</footer>

<div class="ov" id="ov"></div>

<div class="sheet" id="searchSheet" role="dialog" aria-modal="true" aria-label="Search">
  <div class="sheet__top">
    <div class="sheet__grab"></div>
    <div class="sheet__head">
      <h3 class="sheet__title" data-i18n="search">Search</h3>
      <button class="x" data-close type="button" aria-label="Close"><svg viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="sheet__body">
    <label class="sfield">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.5 21.75C5.85 21.75 1.25 17.15 1.25 11.5S5.85 1.25 11.5 1.25 21.75 5.85 21.75 11.5 17.15 21.75 11.5 21.75zm0-19C6.67 2.75 2.75 6.68 2.75 11.5s3.92 8.75 8.75 8.75 8.75-3.93 8.75-8.75S16.33 2.75 11.5 2.75z"/><path d="M22 22.75c-.19 0-.38-.07-.53-.22l-2-2a.75.75 0 111.06-1.06l2 2a.75.75 0 01-.53 1.28z"/></svg>
      <input id="searchInput" type="search" placeholder="Search for dresses, denim…" data-i18n-ph="search_ph" aria-label="Search products" />
    </label>
    <p class="lbl" style="margin-top:0" data-i18n="popular">Popular searches</p>
    <div class="pills" id="sugg"></div>
    <div class="sres" id="sres"></div>
  </div>
</div>

<div class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-label="Shopping cart">
  <div class="sheet__top">
    <div class="sheet__grab"></div>
    <div class="sheet__head">
      <h3 class="sheet__title"><span data-i18n="your_bag">Your Bag</span> <span style="color:var(--muted);font-size:13px" id="cartCountTxt"></span></h3>
      <button class="x" data-close type="button" aria-label="Close"><svg viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="sheet__body" id="cartBody"></div>
  <div class="sheet__foot">
    <div class="free-ship" id="freeShip"></div>
    <div class="row" style="margin-top:10px"><span data-i18n="subtotal">Subtotal</span><span id="sub">0.00 EGP</span></div>
    <div class="row"><span data-i18n="shipping">Shipping</span><span data-i18n="calc_checkout">Calculated at checkout</span></div>
    <div class="row total"><span data-i18n="total">Total</span><b id="tot">0.00 EGP</b></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="velora.js"></script>
<script src="checkout.js"></script>
</body>
</html>
